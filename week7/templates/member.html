{% extends "base.html" %}

{% block title %} Member Page {% endblock %}

{% block scripts %}
	<script src="{{ url_for('static', path='/js/memberScript.js') }}" defer></script>
{% endblock %}

{% block content %}

    <div class="formBlock">
        <h1>歡迎光臨，這是會員頁</h1>
        <div class="memberText">
            <span>{{name}}，歡迎登入系統</span>
            <a href="{{ url_for('logout') }}">登出系統</a>
        </div>

        <hr>

        <div id="tokenBlock" class="tokenText">
            <h3>MCP伺服器設定</h3>
            <span>請使用 http://127.0.0.1:8000/mcp/ 網址</span>
            <span>點擊產生 Token 取得金鑰</span>
            <span id="token" class="token"></span>
            <button class="updateTokenBtn" onclick="updateToken()">產生 Token</button>
        </div>

        <hr>

        <div class="messageText">
            <h3>快來留言吧</h3>
            <div class="labelBlock">
                <label for="content">內容</label>
                <input type="text" id="content" name="content">
            </div>
            <button class="postMessageBtn" onclick="postMessage()">送出</button>
        </div>
        
        <hr>

        <div id="cards" class="cards"></div>
    </div>
	
{% endblock %}
